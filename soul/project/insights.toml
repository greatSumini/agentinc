[[entries]]
id = 9
created_at = "2026-03-19"
last_used_at = "2026-03-21"
content = "subagent/skill 저장 형식을 JSON → frontmatter MD로 전환 결정. JSON은 prompt가 escape 문자(`\\n` 등) 포함된 한 줄 문자열이 되어 사람이 읽고 편집하기 어려움. MD라면 본문으로 넓게 펼쳐서 볼 수 있고, Claude Code 공식 형식과도 일치."

[[entries]]
id = 10
created_at = "2026-03-22"
last_used_at = "2026-04-01"
content = "auto-startup은 로컬 실행 기반이지만, 추후 원격 서버 호스팅을 고려하여 설계한다. IStore 추상화를 통해 파일시스템 의존성을 격리하여 교체 시 변경 범위를 최소화한다."

[[entries]]
