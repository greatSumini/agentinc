content = """auto-startup 전환의 핵심 가치: 복잡한 "회사 운영" 시뮬레이션 대신, 온보딩 → 원칙(principles/) 정의 → 에이전트 기반 실행이라는 단순한 흐름에 집중. 사용자는 목표와 원칙만 제시하면 된다."""
